# .github/workflows/bootstrap.yml
# Thin caller for the reusable bootstrap test authored in dotfiles-core. The logic
# lives there (one place for the whole fleet); this just names Alpine's container +
# the deps bootstrap needs. See dotfiles-core/.github/workflows/bootstrap-test.yml.
name: bootstrap

on:
  # install/packages.txt is consumed directly by bootstrap.sh — a bad entry there
  # breaks provisioning exactly like a bad line in the script, so it must trigger
  # this test too (apk fails the whole transaction on one unknown name).
  pull_request:
    paths: ['bootstrap.sh', 'install/packages.txt', 'core/lib/**', '.github/workflows/bootstrap.yml']
  push:
    branches: [main]
    paths: ['bootstrap.sh', 'install/packages.txt', 'core/lib/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: dotgibson/dotfiles-core/.github/workflows/bootstrap-test.yml@v4
    with:
      image: alpine:3.24
      prep: apk add --no-cache bash zsh
