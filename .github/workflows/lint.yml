name: lint

# Thin caller for the reusable shell/actionlint gate authored in dotfiles-core
# (.github/workflows/lint-call.yml) — one definition for the whole fleet, replacing the
# ~200-line copy this file used to carry. The gate's internals (the SHA-256-verified
# pinned-tool bootstrap, the core/ exclude, shfmt-advisory) live there now. This repo has no
# extra excludes (only Offense does), so no `with:` is needed.
# NO PATH FILTERS — deliberately, and do not add them back. This gate is a REQUIRED
# status check on main. A workflow that never triggers never reports a check-run, and
# a required check with no result blocks the PR forever: a docs-only change would sit
# waiting on a `lint` that was never going to run. Filtering at the `on:` level and
# requiring the check are mutually exclusive; correctness wins over the handful of CI
# minutes an unnecessary run costs on a repo this size.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: dotgibson/dotfiles-core/.github/workflows/lint-call.yml@v4
