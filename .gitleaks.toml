# .gitleaks.toml — secret-scanning config for dotfiles-Alpine.
#
# Extends gitleaks' default ruleset rather than replacing it: this repo is public and
# is public, so the full rule set is what we want. The only local change is a
# scope one.
#
# WHY core/ IS ALLOWLISTED: it is a vendored git-subtree copy of dotfiles-core,
# overwritten on the next sync. Core scans that exact tree itself — gitleaks runs both
# in its pre-commit config and in audit-core.sh §8b — before anything is vendored here,
# so a finding under core/ is both already-caught and unfixable in this repo (the
# core-guard hook refuses commits that touch it). Scanning it here would only produce
# noise that no one is allowed to action.
#
# This also makes `make secrets` agree with the rest of the tooling: the Makefile's
# file lists and .pre-commit-config.yaml both scope to repo-owned files, and gitleaks
# was the one gate still walking the whole tree. Note the pre-commit gitleaks hook
# sets pass_filenames: false, so its `exclude:` cannot restrict the scan — this config
# is the only thing that does, for both entry points.

[extend]
useDefault = true

[allowlist]
description = "vendored Core subtree — scanned upstream, unfixable here"
paths = ['''^core/''']
